[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "liftmate"
version = "0.1.0"
authors = [
    { name = "Sujal", email = "nagsujal9@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42.0",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "google-genai>=0.3",
    "psycopg[binary]>=3.1",
    "pyjwt>=2.8",
]

[tool.setuptools.packages.find]
include = ["app*", "api*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "api.index:app"

